[package]
name = "optimod"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Resource-aware llama.cpp inference advisor for constrained computers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Ymad47/OptiMod"
readme = "README.md"
keywords = ["llama-cpp", "gguf", "inference", "quantization", "cli"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
